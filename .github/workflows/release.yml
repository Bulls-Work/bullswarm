# Release workflow: triggered by pushing a v* tag (npm run release creates it).
# Publishes to npm via OIDC trusted publishing — no npm token stored in secrets.
# Trust is configured on npmjs.com for the trusted publisher Bulls-Work/bullswarm + release.yml
# (the repository moved from cowcow02/bullswarm on 2026-09-16; the old entry answered 404 on publish).

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          # A publishing job never restores a dependency cache (setup-node docs: cache poisoning).
          package-manager-cache: false

      - name: Install dependencies (none expected; guard for future)
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          fi

      - name: Test
        run: npm test

      - name: Bundle the latest public benchmark datapack when available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view benchmark-data-latest >/dev/null 2>&1; then
            gh release download benchmark-data-latest \
              --pattern openrouter-benchmarks.json \
              --dir data \
              --clobber
          else
            echo "No benchmark datapack release exists yet; connector metadata remains the offline fallback."
          fi

      # OIDC trusted publishing needs npm >= 11.5.1; pin npm 11 explicitly.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@11

      - name: Assert package version matches tag
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME}"
          echo "package ${PKG_VERSION} vs tag ${TAG_VERSION}"
          test "${PKG_VERSION}" = "${TAG_VERSION}"

      - name: Publish to npm
        run: npm publish --access public

      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
