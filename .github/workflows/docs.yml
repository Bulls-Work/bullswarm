# Docs workflow: builds the VitePress site in docs-site/ and deploys it to
# GitHub Pages. Pages must be enabled for the repository with "GitHub Actions"
# as the source (Settings → Pages).

name: Docs

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "docs-site/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install docs dependencies
        working-directory: docs-site
        run: npm ci

      - name: Build the site
        working-directory: docs-site
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
